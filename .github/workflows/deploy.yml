# Publish the built app to GitHub Pages.
#
# Separate from `ci.yml` because it has a different trigger and a different
# permission set: this one writes, and a workflow that can deploy should not
# also be the one running on every pull request from a fork.
#
# The site is a single-page app under a sub-path. `GITHUB_PAGES=1` makes Vite
# emit `/vue-stream-dashboard/` as the base, and the 404 page is a copy of
# index.html so a deep link like /connection loads the app instead of GitHub's
# 404 — the router then resolves the path client-side.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. `cancel-in-progress: false` because cancelling a
# deploy mid-flight can leave the site in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.33.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          GITHUB_PAGES: '1'
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
